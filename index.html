<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무수한 실모</title>
<style>
  :root {
    --bg: #1b1d21;
    --panel: #26292f;
    --line: #3a3e46;
    --text: #f1f2f4;
    --muted: #9aa0aa;
    --face: #fbfbf8;
    --second: #d8261c;
    --accent: #3d8bfd;
    --edge: 14px;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    word-break: keep-all;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .hidden { display: none !important; }

  .pill {
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
    height: 38px; padding: 0 18px;
    background: rgba(38,41,47,.92); border: 1px solid var(--line); border-radius: 999px;
    font-size: 15px; font-weight: 600; line-height: 1; letter-spacing: 0; white-space: nowrap;
  }

  /* ---------- 홈 화면 ---------- */
  #home {
    position: absolute; inset: 0; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .top { width: 100%; padding: max(16px, env(safe-area-inset-top, 0px)) 20px 0; }
  .topIn {
    max-width: 760px; margin: 0 auto; min-height: 56px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px;
  }
  .topIn h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .topRight { display: flex; align-items: center; gap: 16px; }
  #today { text-align: right; line-height: 1.4; }
  #today .line { font-size: 15px; font-weight: 700; white-space: nowrap; }
  #today .line strong { font-size: 22px; font-variant-numeric: tabular-nums; margin: 0 2px; }
  #today .detail { font-size: 13px; color: var(--muted); }

  .homeMain {
    margin: 0 auto; width: 100%; max-width: 800px; padding: 42px 20px max(44px, env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 30px;
  }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; }
  .slot {
    min-height: 200px; padding: 22px 14px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; transition: border-color .15s, transform .15s;
  }
  .slot:active { transform: scale(.98); }
  .slot.empty { border-style: dashed; }
  .slot .tag { font-size: 15px; font-weight: 700; color: var(--muted); }
  .slot .main { font-size: clamp(28px, 5.4vw, 46px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; text-wrap: balance; }
  .slot.empty .main { font-size: clamp(42px, 8.5vw, 68px); }
  .slot .sub { font-size: 15px; color: var(--muted); }
  .slot .range { font-size: clamp(15px, 2.6vw, 20px); color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }

  .hint { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.65; margin: 0; }
  .slots + .hint { margin-top: -14px; }

  .trend { width: 100%; }
  .trendHead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .trend h2 { font-size: 16px; font-weight: 700; color: var(--muted); margin: 0; }
  /* 좌우로 미끄러지는 스위치 */
  .switch {
    position: relative; flex: none; width: 168px; height: 40px; padding: 3px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    display: grid; grid-template-columns: 1fr 1fr;
    background: #1c1e22; border: 1px solid #353a42; border-radius: 10px;
  }
  .switch .thumb {
    position: absolute; top: 3px; left: 3px; width: calc(50% - 3px); height: calc(100% - 6px);
    border-radius: 7px; background: #eef0f4; pointer-events: none;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    transition: transform .26s cubic-bezier(.4, 0, .2, 1);
  }
  .switch[data-pos="homer"] .thumb { transform: translateX(100%); }
  .switch .lab {
    position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; line-height: 1; color: #8b929d; transition: color .2s; pointer-events: none;
  }
  .switch[data-pos="score"] .lab.l, .switch[data-pos="homer"] .lab.r { color: #121316; }
  .chartcard {
    background-color: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px 12px;
    transition: background-color .35s ease, border-color .35s ease;
  }
  .chartcard[data-mode="score"] { background-color: #252c37; border-color: #333c4a; }
  @keyframes swapIn { from { opacity: .45; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .chartcard.swap #chart, .chartcard.swap .legend, .chartcard.swap .pointinfo { animation: swapIn .32s ease-out; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 0 0 10px; }
  #chart { position: relative; }
  .chooser {
    position: absolute; z-index: 4; min-width: 150px; padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
    background: #1b1d21; border: 1px solid #484e59; border-radius: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.55);
  }
  .copt {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 9px;
    border: 1px solid #3a3e46; background: #26292f; font-size: 14px; font-weight: 700; text-align: left; white-space: nowrap;
  }
  .cdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend .item {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 10px; border-radius: 999px;
    border: 1px solid transparent; background: transparent; color: var(--text);
    font-size: 14px; font-weight: 700; line-height: 1; transition: opacity .2s, background-color .2s, border-color .2s;
  }
  .legend .item.on { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.24); }
  .legend.has-focus .item:not(.on) { opacity: .42; }
  #chart .strip, #chart .foldbtn { cursor: pointer; }
  .legend .sw { width: 18px; height: 4px; border-radius: 2px; }
  #chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  #chart svg text { font-family: inherit; }
  #chart .hit { cursor: pointer; }
  #chart .empty { margin: 0; padding: 36px 8px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .pointinfo { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 6px 0; font-size: 14px; color: var(--muted); }
  .pointinfo strong { color: var(--text); font-weight: 700; }
  .pointinfo .del {
    flex: none; background: transparent; border: 1px solid #4a4f58; border-radius: 10px;
    padding: 8px 14px; font-size: 14px; color: #f0908a;
  }

  .records { width: 100%; }
  .records h2 { font-size: 16px; font-weight: 700; color: var(--muted); margin: 0 0 12px; }
  .recbox {
    display: flex; flex-direction: column; max-height: min(56vh, 460px); overflow: hidden;
    background: #1f2227; border: 1px solid var(--line); border-radius: 16px;
  }
  .rectop { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .recfilter { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .recfilter::-webkit-scrollbar { display: none; }
  #recClear {
    flex: none; height: 32px; padding: 0 13px; border-radius: 10px; border: 1px solid #4a4f58;
    background: transparent; color: #f0908a; font-size: 14px; font-weight: 700; line-height: 1; white-space: nowrap;
  }
  .rf {
    flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    font-size: 14px; font-weight: 700; line-height: 1; white-space: nowrap;
  }
  .rf.on { background: #eef0f4; border-color: #eef0f4; color: #121316; }
  #records {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: #4a4f58 transparent;
    list-style: none; margin: 0; padding: 10px; display: flex; flex-direction: column; gap: 10px;
  }
  #records:empty { display: none; }
  .rec {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  }
  .rec .head { display: flex; align-items: center; gap: 8px; }
  .rec .subj { font-size: 18px; font-weight: 800; }
  .rec .badge { font-size: 12px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
  .rec .scores { margin-top: 4px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rec .scores .none { color: var(--muted); font-weight: 600; }
  .pen {
    width: 28px; height: 28px; margin-left: 8px; padding: 0; vertical-align: middle;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid #4a4f58; border-radius: 8px; color: var(--muted);
  }
  .pen svg { width: 15px; height: 15px; display: block; }
  .rec .meta { margin-top: 2px; font-size: 13px; color: var(--muted); }
  .rec .del {
    background: transparent; border: 1px solid #4a4f58; border-radius: 10px;
    padding: 9px 14px; font-size: 14px; color: #f0908a;
  }
  #recordsEmpty { margin: 0; padding: 24px 16px; text-align: center; color: var(--muted); font-size: 14px; }

  @media (max-width: 560px) {
    .topRight { width: 100%; justify-content: space-between; }
    #today { text-align: left; }
    .slot { min-height: 168px; padding: 18px 10px; }
    .homeMain { gap: 24px; margin: 0 auto; }
  }

  /* ---------- 과목 선택 창 ---------- */
  #picker {
    position: fixed; inset: 0; z-index: 9; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(10,11,13,.78);
  }
  #picker.on { display: flex; }
  .pbox {
    width: 100%; max-width: 640px; max-height: min(92vh, 780px);
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  }
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .phead h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .ptabs { display: flex; gap: 10px; padding: 14px 18px 0; }
  .ptabs button {
    flex: 1; padding: 10px 8px; border-radius: 14px; border: 1px solid var(--line); background: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .ptabs button .tl { font-size: 13px; font-weight: 700; color: var(--muted); }
  .ptabs button .ts { font-size: 16px; font-weight: 800; }
  .ptabs button .ts.none { color: var(--muted); font-weight: 600; }
  .ptabs button.active { border-color: var(--accent); background: rgba(61,139,253,.14); }
  .ptabs button.active .tl { color: #8fbaff; }
  .pbody { padding: 20px 18px 6px; overflow-y: auto; }
  .pbody h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
  .chip {
    min-height: 58px; padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: transparent;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 17px; font-weight: 700; line-height: 1.25;
  }
  .chip.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pfoot { padding: 12px 18px max(16px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .primary {
    width: 100%; border: 0; border-radius: 14px; padding: 14px 0;
    background: var(--accent); color: #fff; font-size: 18px; font-weight: 700;
  }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  /* ---------- 시계 화면 ---------- */
  #stage { position: fixed; inset: 0; display: none; background: var(--bg); }
  #stage.on { display: block; }
  #clockwrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: max(8px, env(safe-area-inset-top, 0px)) 8px max(8px, env(safe-area-inset-bottom, 0px));
  }
  #clock { width: min(100vw - 16px, 100vh - 16px); height: min(100vw - 16px, 100vh - 16px); max-width: 100%; max-height: 100%; display: block; }
  .bar, .bottombar {
    position: absolute; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding-left: var(--edge); padding-right: var(--edge);
    pointer-events: none;
  }
  .bar > *, .bottombar > * { pointer-events: auto; }
  .bar { top: 0; padding-top: max(var(--edge), env(safe-area-inset-top, 0px)); }
  .bottombar { bottom: 0; padding-bottom: max(var(--edge), env(safe-area-inset-bottom, 0px)); }
  #stage.fs .bar { padding-left: calc(var(--edge) + 72px); }
  #abandon { background: rgba(216,38,28,.20); border-color: rgba(240,104,94,.55); color: #ffb3ac; }
  .tools { display: flex; gap: 8px; margin-left: auto; }
  .pill.icon { width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .pill.icon svg { width: 20px; height: 20px; display: block; }
  #remain {
    font-size: 20px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums;
    visibility: hidden; pointer-events: none;
  }
  #remain.on { visibility: visible; }
  #endBtn {
    margin-left: auto; background: var(--accent); border: 0; border-radius: 14px;
    padding: 14px 26px; font-weight: 700; font-size: 18px; line-height: 1.2; color: #fff;
  }

  /* 5분 남음 알림 */
  #warn5 {
    position: absolute; left: 50%; top: 9%; transform: translateX(-50%);
    display: none; white-space: nowrap; z-index: 3;
    background: var(--second); color: #fff; border-radius: 28px;
    padding: .18em .6em .22em; font-weight: 800; letter-spacing: -0.03em;
    font-size: clamp(44px, 12vw, 120px);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  #warn5.on { display: block; }

  /* 시험 종료 / 점수 입력 */
  #done {
    position: absolute; inset: 0; z-index: 5; display: none; overflow-y: auto;
    background: rgba(15,16,18,.97); padding: 24px;
  }
  #done.on { display: flex; }
  .sheet { margin: auto; width: 100%; max-width: 460px; text-align: center; }
  .sheet .big { font-size: clamp(32px, 8vw, 60px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
  .sheet .subjline { margin-top: 14px; font-size: 20px; font-weight: 700; }
  .sheet .time { margin-top: 6px; color: var(--muted); font-size: 17px; font-variant-numeric: tabular-nums; }
  .sheet .scorebox { margin-top: 30px; }
  .sheet label { display: block; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .inputrow { position: relative; display: inline-block; }
  #scoreInput, #lateInput {
    width: 150px; display: block; font: inherit; font-size: 40px; font-weight: 800; text-align: center;
    background: #111214; color: var(--text); border: 2px solid var(--line); border-radius: 16px; padding: 10px 8px;
    font-variant-numeric: tabular-nums;
  }
  .unit { position: absolute; left: calc(100% + 10px); bottom: 16px; font-size: 22px; font-weight: 700; color: var(--muted); }
  #scoreInput.bad, #scoreInput.bad:focus-visible { border-color: #e5483f; box-shadow: 0 0 0 3px rgba(229,72,63,.25); outline: none; }
  #scoreErr, #lateErr { min-height: 22px; margin-top: 8px; color: #ff8f86; font-size: 14px; }
  .sheet .ask { margin: 22px 0 14px; font-size: 22px; font-weight: 700; }
  .row { display: flex; gap: 12px; }
  .row button {
    flex: 1; border-radius: 14px; padding: 14px 0; font-size: 18px; font-weight: 700;
    border: 1px solid var(--line); background: transparent;
  }
  .row button.yes { background: var(--accent); border-color: var(--accent); color: #fff; }
  #scoreSave { margin-top: 18px; }

  /* 확인 창 */
  #modal, #lateModal {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(10,11,13,.72);
  }
  #modal.on, #lateModal.on { display: flex; }
  .dlg .scorebox { margin: 2px 0 4px; }
  .dlg p.once { margin: 0 0 20px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .dlg {
    width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 28px 24px 24px; text-align: center;
  }
  .dlg p { margin: 0 0 24px; font-size: 22px; font-weight: 700; line-height: 1.45; letter-spacing: -0.01em; white-space: pre-line; }
  .dlg .row button.yes.danger { background: var(--second); border-color: var(--second); }

  @media (prefers-reduced-motion: reduce) {
    .slot, .switch .thumb, .switch .lab, .chartcard, .legend .item { transition: none; }
    .chartcard.swap #chart, .chartcard.swap .legend, .chartcard.swap .pointinfo { animation: none; }
  }
  /* 마우스처럼 hover가 되는 기기에서만 적용 (터치 후 hover 상태가 눌러붙어 반투명 박스가 남는 것을 방지) */
  @media (hover: hover) and (pointer: fine) {
    .pill:hover { border-color: var(--accent); }
    .slot:hover { border-color: var(--accent); }
    .copt:hover { border-color: var(--accent); }
    .legend .item:not(.on):hover { background: rgba(255,255,255,.05); }
    .pointinfo .del:hover { border-color: var(--second); }
    .rf:hover { border-color: #5a606b; }
    #recClear:hover { border-color: var(--second); }
    .pen:hover { border-color: var(--accent); color: var(--text); }
    .rec .del:hover { border-color: var(--second); }
    .chip:hover { border-color: var(--accent); }
    #abandon:hover { background: rgba(216,38,28,.30); border-color: rgba(240,104,94,.85); }
    #endBtn:hover { filter: brightness(1.08); }
  }
</style>
</head>
<body>

<section id="home">
  <header class="top">
    <div class="topIn">
      <h1>무수한 실모</h1>
      <div class="topRight">
        <div id="today" aria-live="polite">
          <div class="line">오늘 응시한 실모 <strong id="todayTotal">0</strong>개</div>
          <div class="detail" id="todayDetail"></div>
        </div>
        <button class="pill" id="editSubjects">과목 수정하기</button>
      </div>
    </div>
  </header>

  <main class="homeMain">
    <div class="slots">
      <button class="slot" id="slot1" data-slot="1"></button>
      <button class="slot" id="slot2" data-slot="2"></button>
    </div>
    <p class="hint">중간에 그만두려면 시계 화면의 탈주하기를 누르세요.</p>

    <section class="trend">
      <div class="trendHead">
        <h2 id="trendTitle">점수 추이</h2>
        <button type="button" class="switch" id="chartSwitch" role="switch" aria-checked="false" aria-label="그래프 종류 전환 (점수 또는 시간)" data-pos="score">
          <span class="thumb"></span><span class="lab l">점수</span><span class="lab r">시간</span>
        </button>
      </div>
      <div class="chartcard" id="chartCard" data-mode="score">
        <div class="legend" id="legend"></div>
        <div id="chart"></div>
        <div class="pointinfo" id="pointInfo"></div>
      </div>
    </section>

    <div class="records">
      <h2>오늘의 응시 기록</h2>
      <div class="recbox" id="recBox">
        <div class="rectop" id="recTop">
          <div class="recfilter" id="recFilter"></div>
          <button type="button" id="recClear">전체 삭제</button>
        </div>
        <ul id="records"></ul>
        <p id="recordsEmpty">아직 응시한 실모가 없어요.</p>
      </div>
    </div>
  </main>
</section>

<section id="stage">
  <div id="clockwrap">
    <svg id="clock" viewBox="-100 -100 200 200" role="img" aria-label="아날로그 시계">
      <circle r="98" fill="#2d3036"/>
      <circle r="94" fill="var(--face)"/>
      <g id="ticks"></g>
      <g id="nums" font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#17181a" text-anchor="middle" font-size="15"></g>
      <g id="hour"><polygon points="-2.1,4 2.1,4 1.5,-22 0.8,-36 0,-45 -0.8,-36 -1.5,-22" fill="#17181a" stroke="#17181a" stroke-width="0.4" stroke-linejoin="round"/></g>
      <g id="minute"><polygon points="-1.7,6 1.7,6 1.15,-34 0.6,-55 0,-67 -0.6,-55 -1.15,-34" fill="#17181a" stroke="#17181a" stroke-width="0.3" stroke-linejoin="round"/></g>

<script>
(function () {
  // 탐구 영역 두 칸: 첫 번째 과목 3:35~4:05, 두 번째 과목 4:07~4:37
  var SLOTS = {
    1: { label: "탐1", startH: 3, startM: 35, range: "3:35 ~ 4:05" },
    2: { label: "탐2", startH: 4, startM: 7,  range: "4:07 ~ 4:37" }
  };
  var SUBJECT_GROUPS = [
    { name: "사회탐구", list: ["생활과 윤리", "윤리와 사상", "한국지리", "세계지리", "동아시아사", "세계사", "경제", "정치와 법", "사회·문화"] },
    { name: "과학탐구", list: ["물리학Ⅰ", "화학Ⅰ", "생명과학Ⅰ", "지구과학Ⅰ", "물리학Ⅱ", "화학Ⅱ", "생명과학Ⅱ", "지구과학Ⅱ"] }
  ];
  var ALL_SUBJECTS = [].concat(SUBJECT_GROUPS[0].list, SUBJECT_GROUPS[1].list);

  var DURATION = 30 * 60;      // 시험 시간(초)
  var WARN_AT = 25 * 60;       // 5분 전
  var WARN_SHOW_MS = 12000;    // 알림 표시 시간

  var $ = function (id) { return document.getElementById(id); };
  var home = $("home"), stage = $("stage"), done = $("done"), modal = $("modal"), picker = $("picker");
  var hourEl = $("hour"), minuteEl = $("minute"), secondEl = $("second");
  var remainEl = $("remain"), warnEl = $("warn5");
  var scoreInput = $("scoreInput"), scoreErr = $("scoreErr");

  // ---------- 시계 눈금과 숫자 ----------
  var ticks = $("ticks"), nums = $("nums"), NS = "http://www.w3.org/2000/svg";
  for (var i = 0; i < 60; i++) {
    var major = i % 5 === 0;
    var r = document.createElementNS(NS, "rect");
    r.setAttribute("x", major ? -1.6 : -0.6);
    r.setAttribute("y", -90);
    r.setAttribute("width", major ? 3.2 : 1.2);
    r.setAttribute("height", major ? 9 : 4);
    r.setAttribute("fill", "#17181a");
    r.setAttribute("transform", "rotate(" + (i * 6) + ")");
    ticks.appendChild(r);
  }
  for (var n = 1; n <= 12; n++) {
    var t = document.createElementNS(NS, "text");
    var a = n * 30 * Math.PI / 180;
    t.setAttribute("x", (Math.sin(a) * 70).toFixed(2));
    t.setAttribute("y", (-Math.cos(a) * 70 + 5.4).toFixed(2));
    t.textContent = n;
    nums.appendChild(t);
  }

  // ---------- 선택한 과목 (직접 수정하기 전까지 계속 유지) ----------
  var SUBJ_KEY = "examTimer.subjects.v1", memSubj = { 1: null, 2: null };
  function loadSubjects() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(SUBJ_KEY)); } catch (e) {}
    if (s && typeof s === "object") {
      return {
        1: ALL_SUBJECTS.indexOf(s[1]) >= 0 ? s[1] : null,
        2: ALL_SUBJECTS.indexOf(s[2]) >= 0 ? s[2] : null
      };
    }
    return { 1: memSubj[1], 2: memSubj[2] };
  }
  function setSubject(slot, subject) {
    var s = loadSubjects();
    s[slot] = subject;
    memSubj = s;
    try { localStorage.setItem(SUBJ_KEY, JSON.stringify(s)); } catch (e) {}
  }

  // ---------- 기록 (날짜 구분 없이, 응시한 순서대로 계속 보관) ----------
  var ALL_KEY = "examTimer.records.v3", OLD_KEY = "examTimer.today.v2", memAll = null;
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function saveAll(arr) {
    memAll = arr;
    try { localStorage.setItem(ALL_KEY, JSON.stringify(arr)); } catch (e) {}
  }
  function loadAll() {
    var arr = null;
    try { arr = JSON.parse(localStorage.getItem(ALL_KEY)); } catch (e) {}
    if (Array.isArray(arr)) return arr;
    if (memAll) return memAll;
    // 이전 버전에서 쓰던 기록이 있으면 그대로 이어받기
    var old = null;
    try { old = JSON.parse(localStorage.getItem(OLD_KEY)); } catch (e) {}
    arr = (old && Array.isArray(old.records)) ? old.records.slice() : [];
    saveAll(arr);
    return arr;
  }
  function findRec(arr, id) {
    for (var j = 0; j < arr.length; j++) if (arr[j].id === id) return arr[j];
    return null;
  }
  function removeRec(id) {
    saveAll(loadAll().filter(function (x) { return x.id !== id; }));
  }
  // 과목별로 응시한 순서대로 회차를 매긴다 (첫 번째 = 1회, 두 번째 = 2회 …)
  function attemptNumbers(all) {
    var count = {}, nums = {};
    all.forEach(function (r) {
      var sub = recSubject(r);
      count[sub] = (count[sub] || 0) + 1;
      nums[r.id] = count[sub];
    });
    return nums;
  }
  // 예전 버전의 기록(생1/지1)도 그대로 읽을 수 있게
  function recSlot(rec) { return rec.slot || (rec.key === "earth" ? 2 : 1); }
  function recSubject(rec) { return rec.subject || (rec.key === "earth" ? "지구과학Ⅰ" : "생명과학Ⅰ"); }

  function fmtDur(sec) {
    var total = Math.round(sec), m = Math.floor(total / 60), s = total % 60;
    return m + "분 " + s + "초";
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60);
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderSlots() {
    var subjects = loadSubjects();
    [1, 2].forEach(function (slot) {
      var b = $("slot" + slot), subj = subjects[slot];
      b.textContent = "";
      b.classList.toggle("empty", !subj);
      if (subj) {
        b.appendChild(el("span", "tag", SLOTS[slot].label));
        b.appendChild(el("span", "main", subj));
      } else {
        b.appendChild(el("span", "main", SLOTS[slot].label));
        b.appendChild(el("span", "sub", "눌러서 과목 선택"));
      }
      b.appendChild(el("span", "range", SLOTS[slot].range));
    });
  }

  // 점수가 비어 있을 때만 보이는 작은 펜 버튼 (한 번 입력하면 사라짐)
  var PEN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>';
  function penBtn(rec, field, label) {
    var b = el("button", "pen");
    b.type = "button"; b.innerHTML = PEN_ICON;
    b.setAttribute("aria-label", label); b.setAttribute("title", "점수 입력");
    b.addEventListener("click", function () { openLate(rec.id, field, label); });
    return b;
  }

  // 다시 그리는 동안 페이지 전체의 스크롤 위치는 그대로 유지
  function keepPageScroll(fn) {
    var top = home.scrollTop;
    fn();
    if (home.scrollTop !== top) home.scrollTop = top;
  }
  function renderToday() {
    keepPageScroll(function () {
      renderSummary();
      renderRecords();
      renderChart();
    });
  }
  function renderSummary() {
    var all = loadAll(), subjects = loadSubjects();
    // 선택한 과목 이름으로 표시 (아직 안 골랐으면 탐1/탐2), 다른 과목으로 본 기록이 있으면 함께 표시
    var entries = [];
    function entry(name) {
      for (var q = 0; q < entries.length; q++) if (entries[q].name === name) return entries[q];
      var en = { name: name, count: 0 };
      entries.push(en);
      return en;
    }
    [1, 2].forEach(function (slot) { entry(subjects[slot] || SLOTS[slot].label); });
    all.forEach(function (x) { entry(recSubject(x)).count++; });
    $("todayTotal").textContent = all.length;
    $("todayDetail").textContent = entries.map(function (en) { return en.name + " " + en.count + "회"; }).join(", ");
  }
  // 응시 기록 상자만 다시 그림 (과목 버튼을 누를 때는 그래프나 페이지는 건드리지 않음)
  function renderRecords(keepHeight) {
    var all = loadAll(), nums = attemptNumbers(all), recBox = $("recBox");
    if (keepHeight) recBox.style.minHeight = recBox.offsetHeight + "px";   // 목록이 짧아져도 상자 크기를 유지해서 페이지 길이가 안 변하게
    else recBox.style.minHeight = "";
    // 과목별로 따로 보기 (상자 위쪽 버튼)
    var color = colorMap(all), subs = [];
    all.forEach(function (r) { var nm = recSubject(r); if (subs.indexOf(nm) < 0) subs.push(nm); });
    if (focusSubject && subs.indexOf(focusSubject) < 0) focusSubject = "";
    var rf = $("recFilter");
    rf.textContent = "";
    $("recTop").classList.toggle("hidden", !all.length);
    function filterChip(label, value, c) {
      var on = focusSubject === value;
      var bt = el("button", "rf" + (on ? " on" : ""));
      bt.type = "button"; bt.setAttribute("aria-pressed", on ? "true" : "false");
      if (c) { var d = el("span", "cdot"); d.style.background = c; bt.appendChild(d); }
      bt.appendChild(document.createTextNode(label));
      bt.addEventListener("click", function () {
        focusSubject = (value && focusSubject === value) ? "" : value;   // 그래프도 같은 과목으로
        clearSelection();
        keepPageScroll(function () { renderRecords(true); renderChart(); });
        $("records").scrollTop = 0;
      });
      return bt;
    }
    if (subs.length) {
      rf.appendChild(filterChip("전체", "", null));
      subs.forEach(function (nm) { rf.appendChild(filterChip(nm, nm, color[nm])); });
    }

    // 가장 최근에 본 것이 위로
    var ul = $("records"), keepTop = ul.scrollTop;
    ul.textContent = "";
    $("recordsEmpty").style.display = all.length ? "none" : "";
    var shown = focusSubject ? all.filter(function (r) { return recSubject(r) === focusSubject; }) : all;
    shown.slice().reverse().forEach(function (rec) {
      var title = recSubject(rec) + " " + nums[rec.id] + "회";
      var li = el("li", "rec");
      var info = el("div", "info");
      var head = el("div", "head");
      head.appendChild(el("span", "subj", title));
      head.appendChild(el("span", "badge", SLOTS[recSlot(rec)].label));
      info.appendChild(head);
      var sc = el("div", "scores");
      if (rec.score1 != null) sc.appendChild(el("span", "", rec.score1 + "점"));
      else { sc.appendChild(el("span", "none", "점수 미입력")); sc.appendChild(penBtn(rec, "score1", title + " 점수 입력")); }
      if (rec.usedExtra) {
        sc.appendChild(document.createTextNode(", "));
        if (rec.score2 != null) sc.appendChild(el("span", "", "호머식 " + rec.score2 + "점"));
        else { sc.appendChild(el("span", "none", "호머식 미입력")); sc.appendChild(penBtn(rec, "score2", title + " 호머식 점수 입력")); }
      }
      info.appendChild(sc);
      if (rec.elapsed != null) info.appendChild(el("div", "meta", fmtDur(rec.elapsed) + " 걸림"));
      var del = el("button", "del", "삭제");
      del.addEventListener("click", function () {
        var label = title + (rec.score1 != null ? " " + rec.score1 + "점" : "") + " 기록을 삭제하겠습니까?";
        ask(label, "삭제", true, function () { removeRec(rec.id); renderToday(); });
      });
      li.appendChild(info); li.appendChild(del);
      ul.appendChild(li);
    });
    ul.scrollTop = keepTop;
  }

  // ---------- 추이 그래프 (가로축: 회차, 과목별 꺾은선) ----------
  // 점수 추이: 세로축 점수 (위로 갈수록 높음). 기본은 29~50점만 보이고 그 아래는 가려져 있다가 눌러서 펼침
  // 시간 추이: 세로축 시간 (위로 갈수록 짧음)
  var PALETTE = ["#4da3ff", "#ff9f43", "#3ddc97", "#ff6b8b", "#b388ff", "#ffd43b", "#22d3ee", "#a3e635", "#e879f9", "#f87171"];
  var TOL = 1;                                   // 같은 회차에서 ±1점(시간은 ±1분) 이내면 겹친 점으로 보고 고르는 창을 띄움
  var SCORE_CARD_BG = "#252c37";                 // 점수 그래프 카드 색 (가림막 그라데이션이 이 색으로 사라짐)
  // 점수 그래프는 29점 아래가 가려짐
  var selectedPoint = "", chooser = null, chartMode = "score", focusSubject = "", scoreExpanded = false;
  function svgEl(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function niceStep(range) { return range <= 6 ? 1 : range <= 14 ? 2 : range <= 30 ? 5 : 10; }
  function lighten(hex, amt) {
    var num = parseInt(hex.slice(1), 16), r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    function m(c) { return Math.round(c + (255 - c) * amt); }
    return "rgb(" + m(r) + "," + m(g) + "," + m(b) + ")";
  }
  function clearSelection() { selectedPoint = ""; chooser = null; }
  // 과목마다 색: 처음 등장한 순서대로 정해서 그래프를 바꿔도, 기록이 늘어도 그대로
  function colorMap(all) {
    var color = {}, seen = 0;
    all.forEach(function (r) {
      var sub = recSubject(r);
      if (!color[sub]) { color[sub] = PALETTE[seen % PALETTE.length]; seen++; }
    });
    return color;
  }
  function mean(a) { var t = 0; a.forEach(function (v) { t += v; }); return t / a.length; }
  // 추세곡선: 모든 점을 가까운 순서로 무게를 달리해 반영하는 가우시안 국소 직선 회귀.
  // 폭(sig)이 넓을수록 매끈하고 좁을수록 점을 따라 깊게 파임
  function trendCurve(xs, ys) {
    var n = xs.length, span = xs[n - 1] - xs[0], gap = span / (n - 1) || 1;
    var sig = 0.85 * gap, S = Math.max(80, (n - 1) * 12), out = [];
    for (var i = 0; i <= S; i++) {
      var x = xs[0] + span * i / S, sw = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
      for (var j = 0; j < n; j++) {
        var dx = xs[j] - x, w = Math.exp(-0.5 * (dx / sig) * (dx / sig));
        sw += w; sx += w * dx; sy += w * ys[j]; sxx += w * dx * dx; sxy += w * dx * ys[j];
      }
      var den = sw * sxx - sx * sx;
      out.push([x, Math.abs(den) < 1e-12 ? sy / sw : (sxx * sy - sx * sxy) / den]);
    }
    return out;
  }

  function renderChart() { keepPageScroll(renderChartInner); }
  function renderChartInner() {
    var box = $("chart"), legend = $("legend"), info = $("pointInfo");
    var measuredW = box.clientWidth;               // 비우기 전에 폭을 재야 페이지 높이가 순간적으로 줄어들지 않음
    box.textContent = ""; legend.textContent = ""; info.textContent = "";
    var homer = chartMode === "homer";
    $("chartCard").setAttribute("data-mode", chartMode);
    var all = loadAll(), nums = attemptNumbers(all), color = colorMap(all);
    var allPts = all.filter(function (r) { return homer ? (r.usedExtra && r.elapsed != null) : r.score1 != null; });
    function val(r) { return homer ? r.elapsed / 60 : r.score1; }

    // 범례: 누르면 그 과목만 보기(응시 기록도 같은 과목으로), 한 번 더 누르면 전체 보기
    var names = [], hasPts = {};
    all.forEach(function (r) { var nm = recSubject(r); if (names.indexOf(nm) < 0) names.push(nm); });
    allPts.forEach(function (r) { hasPts[recSubject(r)] = true; });
    if (focusSubject && names.indexOf(focusSubject) < 0) focusSubject = "";
    legend.classList.toggle("has-focus", !!focusSubject);
    names.forEach(function (name) {
      if (!hasPts[name] && name !== focusSubject) return;
      var on = name === focusSubject;
      var item = el("button", "item" + (on ? " on" : ""));
      item.type = "button";
      item.setAttribute("aria-pressed", on ? "true" : "false");
      item.setAttribute("title", on ? "전체 과목 보기" : name + "만 보기");
      var sw = el("span", "sw"); sw.style.background = color[name];
      item.appendChild(sw); item.appendChild(document.createTextNode(name));
      item.addEventListener("click", function () {
        focusSubject = on ? "" : name;
        clearSelection();
        keepPageScroll(function () { renderRecords(true); renderChart(); });
        $("records").scrollTop = 0;
      });
      legend.appendChild(item);
    });

    var pts = focusSubject ? allPts.filter(function (r) { return recSubject(r) === focusSubject; }) : allPts;
    if (!pts.length) {
      clearSelection();
      box.appendChild(el("p", "empty", focusSubject
        ? focusSubject + "의 " + (homer ? "시간" : "점수") + " 기록이 아직 없어요."
        : (homer ? "추가 시간을 쓴 기록이 생기면 여기에 시간 추이가 그려져요." : "점수를 입력한 기록이 생기면 여기에 과목별 추이가 그려져요.")));
      return;
    }
    if (!pts.some(function (r) { return r.id === selectedPoint; })) selectedPoint = "";

    var order = [], series = {};
    pts.forEach(function (r) {
      var sub = recSubject(r);
      if (!series[sub]) { series[sub] = []; order.push(sub); }
      series[sub].push({ n: nums[r.id], v: val(r), rec: r });
    });

    // 한 과목만 볼 때: 평균·최고·최저 (점이 2개 이상), 3개 이상이면 추세곡선도
    var focus = !!focusSubject, stat = null;
    if (focus && series[focusSubject] && series[focusSubject].length >= 2) {
      var sl = series[focusSubject], sxs = sl.map(function (q) { return q.n; }), sys = sl.map(function (q) { return q.v; });
      stat = {
        avg: mean(sys), max: Math.max.apply(null, sys), min: Math.min.apply(null, sys),
        curve: sl.length >= 3 ? trendCurve(sxs, sys) : null
      };
    }

    var W = Math.max(280, Math.round(measuredW || 600));
    var H = Math.round(Math.max(250, Math.min(350, W * 0.56)));    // 세로를 넉넉히 해서 점수 변동이 잘 보이게
    // 점수 그래프는 숫자 눈금이 왼쪽, 시간 그래프는 오른쪽
    var collapsed = !homer && !scoreExpanded;               // 29점 아래를 가리고 있는 상태
    var G = collapsed ? 36 : 0;                             // 가려진(그라데이션) 구간의 높이
    var U = 34;                                             // 하얀 그라데이션이 29점 선 위쪽으로 올라오는 길이
    var L = homer ? 14 : 40, R = homer ? 46 : 14, T = 20, B = 30, PAD = 14;
    var PADR = focus ? (homer ? 100 : 92) : PAD;           // 한 과목만 볼 때는 오른쪽에 숫자 자리를 남김
    var plotW = W - L - R, plotH = H - T - B - G, innerW = plotW - PAD - PADR;
    var yBottom = T + plotH;                                // 눈금의 맨 아래 (25점 / 0점 / 시간 맨 아래)
    var maxN = 1;
    pts.forEach(function (r) { if (nums[r.id] > maxN) maxN = nums[r.id]; });
    function X(nn) { return maxN === 1 ? L + (plotW - PADR + PAD) / 2 : L + PAD + (nn - 1) * innerW / (maxN - 1); }

    // 세로축 범위
    var mn, mx, lo, hi, step;
    if (!homer) {
      hi = 50;
      if (collapsed) { lo = 29; step = 5; }                // 29점 아래는 범위 계산에서 무시 → 화면에는 29~50만
      else { lo = 0; step = 10; }
    } else {
      var vals = [];
      pts.forEach(function (r) { vals.push(val(r)); });
      if (stat && stat.curve) stat.curve.forEach(function (c) { vals.push(c[1]); });
      vals.push(30);                               // 본 시험 시간(30분)이 항상 보이게
      mn = Math.min.apply(null, vals); mx = Math.max.apply(null, vals);
      lo = Math.max(0, Math.floor(mn - 1)); hi = Math.ceil(mx + 1);
      if (hi - lo < 4) hi = lo + 4;
      step = niceStep(hi - lo);
      lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    }
    function Y(v) { return homer ? T + (v - lo) / (hi - lo) * plotH : T + (hi - v) / (hi - lo) * plotH; }
    function fmtVal(v) { return homer ? Math.round(v) + "분" : String(v); }
    function visible(y) { return !collapsed || y <= yBottom + 1; }   // 가려진 구간 안의 점은 숫자·선택 대상에서 제외

    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img", "aria-label": homer ? "과목별 시간 추이" : "과목별 점수 추이" });
    var ticks = [];
    if (collapsed) ticks = [30, 35, 40, 45, 50];                                   // 29점 경계는 눈금 없이 그라데이션이 시작되는 곳
    else for (var tv = lo; tv <= hi; tv += step) ticks.push(tv);
    ticks.forEach(function (t) {
      var gl = { x1: L, x2: W - R, y1: Y(t), y2: Y(t), stroke: homer ? "#434852" : "#3a3e46", "stroke-width": 1 };
      if (homer) gl["stroke-dasharray"] = "1 5"; gl["stroke-linecap"] = "round";
      svg.appendChild(svgEl("line", gl));
      var yl = svgEl("text", homer
        ? { x: W - R + 10, y: Y(t) + 4, "text-anchor": "start", "font-size": 12, fill: "#9aa0aa" }
        : { x: L - 8, y: Y(t) + 4, "text-anchor": "end", "font-size": 12, fill: "#9aa0aa" });
      yl.textContent = homer ? t + "분" : t;
      svg.appendChild(yl);
    });
    // 데이터는 가려진 구간까지만 그리도록 잘라냄 (그 아래는 그라데이션으로 가림)
    var uid = "c" + Math.random().toString(36).slice(2, 8), dg = svg;
    if (collapsed) {
      var defs = svgEl("defs", {});
      var cp = svgEl("clipPath", { id: uid });
      cp.appendChild(svgEl("rect", { x: 0, y: 0, width: W, height: yBottom + G }));
      defs.appendChild(cp);
      var lg = svgEl("linearGradient", { id: uid + "g", x1: 0, y1: 0, x2: 0, y2: 1 });
      lg.appendChild(svgEl("stop", { offset: "0%", "stop-color": SCORE_CARD_BG, "stop-opacity": 0 }));
      lg.appendChild(svgEl("stop", { offset: "55%", "stop-color": SCORE_CARD_BG, "stop-opacity": 0.78 }));
      lg.appendChild(svgEl("stop", { offset: "100%", "stop-color": SCORE_CARD_BG, "stop-opacity": 1 }));
      defs.appendChild(lg);
      var wg = svgEl("linearGradient", { id: uid + "w", x1: 0, y1: 0, x2: 0, y2: 1 });   // 위쪽은 차트 배경과 이어지고, 아래로 갈수록 살짝 하얘짐
      wg.appendChild(svgEl("stop", { offset: "0%", "stop-color": "#ffffff", "stop-opacity": 0 }));
      wg.appendChild(svgEl("stop", { offset: "50%", "stop-color": "#ffffff", "stop-opacity": 0.045 }));
      wg.appendChild(svgEl("stop", { offset: "85%", "stop-color": "#ffffff", "stop-opacity": 0.13 }));
      wg.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#ffffff", "stop-opacity": 0.1 }));
      defs.appendChild(wg);
      var hg = svgEl("linearGradient", { id: uid + "h", x1: 0, y1: 0, x2: 1, y2: 0 });      // 눈금선 폭에 맞추고, 좌우 끝은 부드럽게 사라지게
      hg.appendChild(svgEl("stop", { offset: "0%", "stop-color": "#fff", "stop-opacity": 0 }));
      hg.appendChild(svgEl("stop", { offset: "10%", "stop-color": "#fff", "stop-opacity": 1 }));
      hg.appendChild(svgEl("stop", { offset: "90%", "stop-color": "#fff", "stop-opacity": 1 }));
      hg.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#fff", "stop-opacity": 0 }));
      defs.appendChild(hg);
      var mk = svgEl("mask", { id: uid + "m", maskUnits: "userSpaceOnUse", x: L, y: yBottom - U, width: plotW, height: G + U });
      mk.appendChild(svgEl("rect", { x: L, y: yBottom - U, width: plotW, height: G + U, fill: "url(#" + uid + "h)" }));
      defs.appendChild(mk);
      svg.appendChild(defs);
      dg = svgEl("g", { "clip-path": "url(#" + uid + ")" });
      svg.appendChild(dg);
    }
    // 시간 그래프: 본 시험 시간(30분) 기준선. 각 점에서 이 선까지 이어지는 세로선이 추가로 쓴 시간
    if (homer) {
      svg.appendChild(svgEl("line", { x1: L, x2: W - R, y1: Y(30), y2: Y(30), stroke: "#aab1bc", "stroke-width": 1.2, "stroke-dasharray": "6 4", "stroke-opacity": 0.8 }));
      var rl = svgEl("text", { x: L + 2, y: Y(30) - 6, "text-anchor": "start", "font-size": 11, "font-weight": 600, fill: "#aab1bc" });
      rl.textContent = "본 시험 30분";
      svg.appendChild(rl);
    }
    // 가로축: 회차 (자리가 좁으면 건너뛰며 표시)
    var spacing = maxN > 1 ? innerW / (maxN - 1) : 100;
    var every = Math.max(1, Math.ceil(34 / spacing));
    for (var nn = 1; nn <= maxN; nn += every) {
      var xl = svgEl("text", { x: X(nn), y: H - 8, "text-anchor": "middle", "font-size": 12, fill: "#9aa0aa" });
      xl.textContent = nn + "회";
      svg.appendChild(xl);
    }

    // 모든 점을 실제 위치에 하나씩 (겹쳐도 합치지 않음)
    var plist = [];
    order.forEach(function (name) {
      series[name].forEach(function (q, k) {
        plist.push({ name: name, color: color[name], n: q.n, v: q.v, x: X(q.n), y: Y(q.v), rec: q.rec, last: k === series[name].length - 1 });
      });
    });
    var colTop = {};                       // 각 회차에서 화면 맨 위에 있는 점 (숫자를 위쪽에 쓰고, 나머지는 아래쪽에)
    plist.forEach(function (pt) { if (colTop[pt.n] == null || pt.y < colTop[pt.n]) colTop[pt.n] = pt.y; });
    var selRec = null;
    pts.forEach(function (r) { if (r.id === selectedPoint) selRec = r; });

    // 시간 그래프: 기준선에서 각 점까지의 세로선
    if (homer) {
      plist.forEach(function (pt) {
        if (Math.abs(pt.y - Y(30)) < 2) return;
        dg.appendChild(svgEl("line", { x1: pt.x, x2: pt.x, y1: Y(30), y2: pt.y, stroke: pt.color, "stroke-width": 2, "stroke-opacity": 0.45, "stroke-linecap": "round" }));
      });
    }
    // 선 (과목별)
    order.forEach(function (name) {
      var list = series[name];
      if (list.length > 1) {
        dg.appendChild(svgEl("polyline", {
          points: list.map(function (q) { return X(q.n).toFixed(1) + "," + Y(q.v).toFixed(1); }).join(" "),
          fill: "none", stroke: color[name], "stroke-width": homer ? 2 : 2.5, "stroke-linejoin": "round", "stroke-linecap": "round",
          "stroke-opacity": stat && stat.curve ? 0.55 : 1
        }));
      }
    });
    // 한 과목만 볼 때의 추세곡선 (점선)
    if (stat && stat.curve) {
      dg.appendChild(svgEl("path", {
        d: stat.curve.map(function (c, i) { return (i ? "L" : "M") + X(c[0]).toFixed(1) + "," + Y(c[1]).toFixed(1); }).join(" "),
        fill: "none", stroke: lighten(color[focusSubject], 0.4), "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": "8 6"
      }));
    }

    // 점수 그래프: 선택한 점 위에 호머식 점수를 연한 색 점으로 (다른 곳을 누르면 사라짐)
    var homerDotY = null;
    if (!homer && selRec && selRec.usedExtra && selRec.score2 != null) {
      var hx = X(nums[selRec.id]), hy = Y(selRec.score2), sy = Y(selRec.score1);
      homerDotY = hy;
      var hc = lighten(color[recSubject(selRec)], 0.55);
      if (Math.abs(hy - sy) > 7) {
        dg.appendChild(svgEl("line", { x1: hx, x2: hx, y1: sy, y2: hy, stroke: hc, "stroke-width": 1.6, "stroke-dasharray": "3 3" }));
        dg.appendChild(svgEl("circle", { cx: hx, cy: hy, r: 4.6, fill: hc, stroke: "#26292f", "stroke-width": 2 }));
      } else {
        dg.appendChild(svgEl("circle", { cx: hx, cy: hy, r: 8.5, fill: "none", stroke: hc, "stroke-width": 2 }));
      }
      var hAbove = hy < sy || Math.abs(hy - sy) <= 7;
      var ht = svgEl("text", {
        x: hx, y: hAbove ? hy - 12 : hy + 20, "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: hc,
        stroke: "#26292f", "stroke-width": 3, "paint-order": "stroke"
      });
      ht.textContent = selRec.score2;
      dg.appendChild(ht);
    }

    // 점: 점수 그래프는 꽉 찬 동그라미, 시간 그래프는 속이 빈 동그라미
    var showAll = pts.length <= 12, labeled = {};
    plist.forEach(function (pt) {
      var selected = pt.rec.id === selectedPoint;
      if (selected) dg.appendChild(svgEl("circle", { cx: pt.x, cy: pt.y, r: homer ? 10 : 9, fill: "none", stroke: "#f1f2f4", "stroke-width": 2 }));
      if (homer) {
        dg.appendChild(svgEl("circle", { cx: pt.x, cy: pt.y, r: 5.2, fill: selected ? pt.color : "#26292f", stroke: pt.color, "stroke-width": 2.4 }));
      } else {
        dg.appendChild(svgEl("circle", { cx: pt.x, cy: pt.y, r: 4.6, fill: pt.color, stroke: "#26292f", "stroke-width": 2 }));
      }
      if ((showAll || pt.last || selected) && visible(pt.y)) {
        var seenY = labeled[pt.n] || (labeled[pt.n] = []);
        var dup = seenY.some(function (yy) { return Math.abs(yy - pt.y) < 3; });   // 거의 같은 위치면 숫자는 한 번만
        if (!dup || selected) {
          var above = pt.y === colTop[pt.n] ? (pt.y - 12 >= 10) : !(pt.y + 20 <= yBottom + 6);
          if (selected && homerDotY != null && homerDotY < pt.y) above = false;   // 호머식 점이 위에 있으면 숫자는 아래로
          var tx = svgEl("text", {
            x: pt.x, y: above ? pt.y - 12 : pt.y + 20, "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: pt.color,
            stroke: "#26292f", "stroke-width": 3, "paint-order": "stroke"
          });
          tx.textContent = fmtVal(pt.v);
          dg.appendChild(tx);
          seenY.push(pt.y);
        }
      }
    });

    // 한 과목만 볼 때: 오른쪽 끝에 평균·최고·최저를 적어 둠 (시간 그래프는 최단·최장)
    if (stat) {
      var u = homer ? "분" : "점", f1 = function (v) { return homer ? v.toFixed(1) : String(v); };
      var lines = [
        "평균 " + stat.avg.toFixed(1) + u,
        (homer ? "최단 " : "최고 ") + f1(homer ? stat.min : stat.max) + u,
        (homer ? "최장 " : "최저 ") + f1(homer ? stat.max : stat.min) + u
      ];
      var endY = Y(stat.curve ? stat.curve[stat.curve.length - 1][1] : series[focusSubject][series[focusSubject].length - 1].v);
      var ty0 = Math.min(Math.max(endY - 18, T + 8), yBottom - 8 - (lines.length - 1) * 15);
      var tcol = lighten(color[focusSubject], 0.3);
      lines.forEach(function (ln, i) {
        var st = svgEl("text", {
          x: X(maxN) + 16, y: ty0 + i * 15, "text-anchor": "start", "font-size": 12, "font-weight": 700, fill: tcol,
          stroke: "#26292f", "stroke-width": 3, "paint-order": "stroke"
        });
        st.textContent = ln;
        svg.appendChild(st);
      });
    }

    // 29점 아래를 가리는 그라데이션: 눌러서 전체(0~50점) 보기
    if (collapsed) {
      svg.appendChild(svgEl("rect", { x: L - 2, y: yBottom, width: plotW + 4, height: G, fill: "url(#" + uid + "g)", "pointer-events": "none" }));
      svg.appendChild(svgEl("rect", { x: L, y: yBottom - U, width: plotW, height: G + U, fill: "url(#" + uid + "w)", mask: "url(#" + uid + "m)", "pointer-events": "none" }));
      var strip = svgEl("rect", { x: L, y: yBottom - 14, width: plotW, height: G + 20, fill: "transparent", "class": "strip" });
      strip.setAttribute("role", "button"); strip.setAttribute("aria-label", "29점 아래까지 전체 보기");
      strip.addEventListener("click", function (e) {
        e.stopPropagation();
        scoreExpanded = true; clearSelection();
        renderChart();
      });
      svg.appendChild(strip);
      var hint = svgEl("text", { x: L + plotW / 2, y: yBottom + G - 9, "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: "#c6ccd6", "pointer-events": "none" });
      hint.textContent = "눌러서 전체 보기";
      svg.appendChild(hint);
    }

    // 누르기 쉽도록 보이지 않는 원을 맨 위에 (가려진 구간의 점은 제외)
    plist.forEach(function (pt) {
      if (!visible(pt.y)) return;
      var c = svgEl("circle", { cx: pt.x, cy: pt.y, r: 14, fill: "transparent", "class": "hit" });
      c.addEventListener("click", function (e) {
        e.stopPropagation();
        var near = plist.filter(function (q) { return q.n === pt.n && Math.abs(q.v - pt.v) <= TOL + 1e-9; });
        if (near.length > 1) {                                   // ±1 이내로 겹친 점들 → 어느 시험인지 고르는 작은 창
          chooser = (chooser && chooser.anchor === pt.rec.id) ? null : { anchor: pt.rec.id, ids: near.map(function (q) { return q.rec.id; }) };
        } else {
          selectedPoint = selectedPoint === pt.rec.id ? "" : pt.rec.id;
          chooser = null;
        }
        renderChart();
      });
      svg.appendChild(c);
    });
    // 펼친 상태: "눌러서 전체 보기" 글자가 있던 자리(가운데 아래)에 "다시 가리기"
    if (!homer && scoreExpanded) {
      var fx = L + plotW / 2, fy = H - B - 9;
      var fg = svgEl("g", { "class": "foldbtn", role: "button", tabindex: 0, "aria-label": "29점 아래를 다시 가리기" });
      fg.appendChild(svgEl("rect", { x: fx - 48, y: fy - 17, width: 96, height: 26, rx: 13, fill: "#363d47", stroke: "#ffffff", "stroke-opacity": 0.22, "stroke-width": 1 }));
      var ft = svgEl("text", { x: fx, y: fy, "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: "#c6ccd6", "pointer-events": "none" });
      ft.textContent = "다시 가리기";
      fg.appendChild(ft);
      var collapseAgain = function (e) { e.stopPropagation(); scoreExpanded = false; clearSelection(); renderChart(); };
      fg.addEventListener("click", collapseAgain);
      fg.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); collapseAgain(e); } });
      svg.appendChild(fg);
    }
    box.appendChild(svg);

    // 겹친 점 중에서 고르는 창 (점 옆에 표시)
    if (chooser) {
      var anchor = null;
      plist.forEach(function (q) { if (q.rec.id === chooser.anchor) anchor = q; });
      if (!anchor) { chooser = null; }
      else {
        var pop = el("div", "chooser");
        chooser.ids.forEach(function (id) {
          var q = null;
          plist.forEach(function (z) { if (z.rec.id === id) q = z; });
          if (!q) return;
          var bt = el("button", "copt");
          var dot = el("span", "cdot"); dot.style.background = q.color;
          bt.appendChild(dot);
          bt.appendChild(document.createTextNode(q.name + " " + q.n + "회"));
          bt.addEventListener("click", function (e) {
            e.stopPropagation();
            selectedPoint = q.rec.id; chooser = null;
            renderChart();
          });
          pop.appendChild(bt);
        });
        pop.addEventListener("click", function (e) { e.stopPropagation(); });
        box.appendChild(pop);
        var pw = pop.offsetWidth, ph = pop.offsetHeight;
        var px = anchor.x + 16;
        if (px + pw > W - 4) px = anchor.x - 16 - pw;
        px = Math.max(4, px);
        var py = Math.min(Math.max(anchor.y - ph / 2, 4), Math.max(4, H - ph - 4));
        pop.style.left = px + "px"; pop.style.top = py + "px";
      }
    }

    // 선택한 점의 내용
    if (selRec) {
      var name = recSubject(selRec) + " " + nums[selRec.id] + "회";
      var txt = el("span", "");
      if (!homer) {
        txt.appendChild(el("strong", "", name + " " + selRec.score1 + "점"));
        if (selRec.usedExtra && selRec.score2 != null) txt.appendChild(document.createTextNode(", 호머식 " + selRec.score2 + "점"));
      } else {
        txt.appendChild(el("strong", "", name + " 총 " + fmtDur(selRec.elapsed)));
        var detail = "";
        if (selRec.elapsed1 != null) detail = " (본 시험 " + fmtDur(selRec.elapsed1) + " + 추가 " + fmtDur(Math.max(0, selRec.elapsed - selRec.elapsed1)) + ")";
        if (selRec.score2 != null) detail += ", 호머식 " + selRec.score2 + "점";
        if (detail) txt.appendChild(document.createTextNode(detail));
      }
      var del = el("button", "del", "삭제");
      del.addEventListener("click", function () {
        ask(name + " 기록을 삭제하겠습니까?", "삭제", true, function () {
          removeRec(selRec.id); clearSelection(); renderToday();
        });
      });
      info.appendChild(txt); info.appendChild(del);

    done.classList.remove("on");
    updateButtons();
    scoreInput.blur();             // 키보드부터 내리고
    // 키보드가 완전히 내려간 뒤에 전체 화면으로 (키보드 애니메이션과 겹치면 아이패드에서 멈추는 문제 방지)
    setTimeout(function () { if (phase === "extra" && stage.classList.contains("on")) enterFullscreen(); }, 450);
    resume();                      // 멈췄던 지점에서 이어서 돌아감
    });
  });
  $("extraNo").addEventListener("click", function () {
    if (phase !== "ended1") return;
    withScore("점수를 입력하지 않겠습니까?", function (score) {
      if (phase !== "ended1") return;
      saveRec({ score1: score, elapsed1: Math.round(accum), usedExtra: false, elapsed: Math.round(accum) });
      goHome();
    });
  });
  function saveExtraScore() {
    if (phase !== "ended2") return;
    withScore("호머식 점수를 입력하지 않겠습니까?", function (score) {
      if (phase !== "ended2") return;
      saveRec({ score2: score, elapsed: Math.round(accum) });
      goHome();
    });
  }
  $("scoreSave").addEventListener("click", saveExtraScore);
  // 점수를 쓰려고 키보드를 열기 전에 전체 화면부터 깔끔하게 해제 (키보드와 전체 화면이 동시에 얽히지 않게)
  scoreInput.addEventListener("focus", function () { exitFullscreen(); });
  scoreInput.addEventListener("keydown", function (e) { if (e.key === "Enter") saveExtraScore(); });
  scoreInput.addEventListener("input", function () { scoreInput.value = scoreInput.value.replace(/\D/g, ""); scoreErr.textContent = ""; scoreInput.classList.remove("bad"); });

  // 종료 버튼
  $("endBtn").addEventListener("click", function () {
    if (modal.classList.contains("on")) return;
    if (phase === "running") {
      ask("시험을 종료하겠습니까?", "예", false, function () {
        if (phase !== "running") return;
        endRegular(Math.min(elapsedNow(), DURATION));
      });
    } else if (phase === "extra") {
      endExtra();
    }
  });
  $("abandon").addEventListener("click", askAbandon);

  // ---------- 화면 켜짐 유지 ----------
  function requestWake() {
    try {
      if (navigator.wakeLock) {
        navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {});
      }
    } catch (e) {}
  }
  function releaseWake() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }

  // ---------- 기타 이벤트 ----------
  [1, 2].forEach(function (slot) {
    $("slot" + slot).addEventListener("click", function () {
      var subject = loadSubjects()[slot];
      if (!subject) { openPicker(slot, "single"); return; }
      ask(subject + " 실모를 응시하겠습니까?", "예", false, function () { start(slot); });
    });
  });
  $("fs").addEventListener("click", function () {
    if (isFullscreen()) exitFullscreen(); else enterFullscreen();
  });
  $("toggleRemain").addEventListener("click", function () {
    showRemain = !showRemain;
    remainEl.classList.toggle("on", showRemain);
    this.textContent = showRemain ? "남은 시간 숨기기" : "남은 시간 보기";
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (modal.classList.contains("on")) { closeAsk(); return; }
    if (lateModal.classList.contains("on")) { closeLate(); return; }
    if (picker.classList.contains("on")) { closePicker(); return; }
    if (stage.classList.contains("on") && phase === "running") askAbandon();
  });

  setHands(12 * 3600);
  updateFsIcon();
  renderSlots();
  renderToday();
})();
</script>
</body>
</html>
